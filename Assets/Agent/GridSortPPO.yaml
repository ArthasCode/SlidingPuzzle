behaviors:
  Grid:      
    trainer_type: ppo     
    hyperparameters:       
      batch_size: 128       
      buffer_size: 2048       
      learning_rate: 0.0003       
      beta: 0.05       
      epsilon: 0.2       
      lambd: 0.95       
      num_epoch: 3       
      shared_critic: false       
      learning_rate_schedule: linear       
      beta_schedule: linear       
      epsilon_schedule: linear     
    checkpoint_interval: 500000     
    network_settings:       
      normalize: true       
      hidden_units: 64       
      num_layers: 2       
      vis_encode_type: simple       
      memory: null       
      goal_conditioning_type: hyper       
      deterministic: false     
    reward_signals:       
      extrinsic:         
        gamma: 0.99         
        strength: 1.0         
    network_settings:           
      normalize: false           
      hidden_units: 128           
      num_layers: 2           
      vis_encode_type: simple           
      memory: null           
      goal_conditioning_type: hyper           
      deterministic: false     
    init_path: null     
    keep_checkpoints: 5     
    even_checkpoints: false     
    max_steps: 2400000     
    time_horizon: 64     
    summary_freq: 120000     
    threaded: false     
    self_play: null     
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 30
  no_graphics: true
  no_graphics_monitor: true
environment_parameters: 
  puzzle_difficulty:
    curriculum:
      - name: OneToComplete
        completion_criteria:
          measure: reward
          behavior: Grid
          signal_smoothing: true
          min_lesson_length: 5
          threshold: 0.95
        value: 1.0
      - name: ThreeToComplete
        completion_criteria:
          measure: reward
          behavior: Grid
          signal_smoothing: true
          min_lesson_length: 15
          threshold: 0.85
        value: 3.0
      - name: FiveToComplete
        completion_criteria:
          measure: reward
          behavior: Grid
          signal_smoothing: true
          min_lesson_length: 25
          threshold: 0.75
        value: 5.0
      - name: TenToComplete
        completion_criteria:
          measure: reward
          behavior: Grid
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 0.5
        value: 10.0
      - name: FifteenToComplete
        completion_criteria:
          measure: reward
          behavior: Grid
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 0.4
        value: 15.0
      - name: TwentyToComplete
        value: 20.0
checkpoint_settings:
  run_id: GridSort
  initialize_from: null
  load_model: false
  resume: false
  force: true
  inference: false
  results_dir: results
torch_settings:
  device: cuda
debug: false
